<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="960" height="620" role="img" aria-label="易搭 YIDA 前端架构与数据流分层图">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#b8893c"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="620" fill="#faf8f3"/>
  <text x="40" y="40" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="22" font-weight="700" fill="#2a251d">易搭 YIDA · 前端架构与数据流</text>
  <text x="40" y="64" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#6b6255">零构建工具 · 零后端依赖 · 数据不出端 · 同一套 H5 编译为 Android APK</text>

  <!-- Layer 1 -->
  <rect x="40" y="86" width="140" height="74" rx="8" fill="#2a251d"/>
  <text x="110" y="118" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="700" fill="#f4eee6">入口 / UI</text>
  <text x="110" y="140" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#d6c59e">H5 唯一真相源</text>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="195" y="94" width="215" height="58" rx="7" fill="#ffffff" stroke="#e3dccb"/>
    <text x="302" y="118" text-anchor="middle" font-size="13" font-weight="600" fill="#2a251d">index.html</text>
    <text x="302" y="137" text-anchor="middle" font-size="11" fill="#6b6255">经典 script / 固定加载顺序</text>
    <rect x="420" y="94" width="215" height="58" rx="7" fill="#ffffff" stroke="#e3dccb"/>
    <text x="527" y="118" text-anchor="middle" font-size="13" font-weight="600" fill="#2a251d">CSS 双主题</text>
    <text x="527" y="137" text-anchor="middle" font-size="11" fill="#6b6255">space 深空黑金 / flow 雾紫</text>
    <rect x="645" y="94" width="240" height="58" rx="7" fill="#ffffff" stroke="#e3dccb"/>
    <text x="765" y="118" text-anchor="middle" font-size="13" font-weight="600" fill="#2a251d">IIFE 全局命名空间</text>
    <text x="765" y="137" text-anchor="middle" font-size="11" fill="#6b6255">无 ESM · 无打包器 · file:// 可用</text>
  </g>
  <path d="M480,160 L480,180" stroke="#b8893c" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Layer 2 -->
  <rect x="40" y="184" width="140" height="74" rx="8" fill="#2a251d"/>
