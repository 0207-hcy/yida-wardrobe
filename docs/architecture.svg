    <rect x="373" y="388" width="168" height="58" rx="7" fill="#f3f6f1" stroke="#c9d6c2"/>
    <text x="457" y="412" text-anchor="middle" font-size="13" font-weight="600" fill="#2a251d">IndexedDB 广场库</text>
    <text x="457" y="431" text-anchor="middle" font-size="11" fill="#6b6255">独立命名空间 · 零污染</text>
    <rect x="551" y="388" width="168" height="58" rx="7" fill="#f3f6f1" stroke="#c9d6c2"/>
    <text x="635" y="412" text-anchor="middle" font-size="13" font-weight="600" fill="#2a251d">系统衣库 49 件</text>
    <text x="635" y="431" text-anchor="middle" font-size="11" fill="#6b6255">受控词表打标</text>
    <rect x="729" y="388" width="156" height="58" rx="7" fill="#f3f6f1" stroke="#c9d6c2"/>
    <text x="807" y="412" text-anchor="middle" font-size="13" font-weight="600" fill="#2a251d">上传双模式</text>
    <text x="807" y="431" text-anchor="middle" font-size="11" fill="#6b6255">抠图 / 本机降级</text>
