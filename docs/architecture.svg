    <text x="302" y="510" text-anchor="middle" font-size="13" font-weight="600" fill="#2a251d">Capacitor 6</text>
    <text x="302" y="529" text-anchor="middle" font-size="11" fill="#6b6255">sync-www → cap sync</text>
    <rect x="420" y="486" width="215" height="58" rx="7" fill="#ffffff" stroke="#e3dccb"/>
    <text x="527" y="510" text-anchor="middle" font-size="13" font-weight="600" fill="#2a251d">assets/public · 131</text>
    <text x="527" y="529" text-anchor="middle" font-size="11" fill="#6b6255">逐字节一致性自检</text>
    <rect x="645" y="486" width="240" height="58" rx="7" fill="#ffffff" stroke="#e3dccb"/>
    <text x="765" y="510" text-anchor="middle" font-size="13" font-weight="600" fill="#2a251d">Android APK + 模拟器验证</text>
    <text x="765" y="529" text-anchor="middle" font-size="11" fill="#6b6255">JDK17 / SDK35 / Gradle</text>
  </g>

  <line x1="40" y1="574" x2="920" y2="574" stroke="#e3dccb"/>
  <text x="40" y="598" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#6b6255">个人照片 / 标签 / 历史 / 收藏全部留在本机 · 无账号 · 无云端调用 · 离线可玩</text>
