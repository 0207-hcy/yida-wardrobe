    <rect x="729" y="290" width="156" height="58" rx="7" fill="#ffffff" stroke="#e3dccb"/>
    <text x="807" y="314" text-anchor="middle" font-size="13" font-weight="600" fill="#2a251d">结果 / 历史 / 海报</text>
    <text x="807" y="333" text-anchor="middle" font-size="11" fill="#6b6255">Canvas · 收藏牌</text>
  </g>
  <path d="M480,356 L480,376" stroke="#b8893c" stroke-width="2" marker-end="url(#arrow)"/>

